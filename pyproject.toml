[project]
name = "private-credit-work"
version = "0.1.0"
description = "Cliffwater private credit liquidity analysis and extraction tooling"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "pandas>=2.0",
  "pdfminer.six>=20221105",
  "plotly>=5.18",
  "pyarrow>=15.0",
  "streamlit>=1.32",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
